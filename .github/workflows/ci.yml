name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for all jobs: they only read the repo (checkout +
# build/test). No job writes contents, comments, or other resources.
permissions:
  contents: read

# Rapid pushes to the same PR branch (force-push/fixup-commit cycles) would
# otherwise queue overlapping full job sets rather than cancel the superseded
# run (devops-expert acceptance finding). Scoped by ref, not by job, since this
# is a workflow-level setting.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace and plugin configs
        run: bash scripts/validate.sh

  # This job is the required status check (python-tests (3.9),
  # python-tests (3.13)). It must always run and report - so the JOB runs
  # unconditionally and only the heavy STEPS are gated by a path diff so PRs
  # that don't touch maven-mcp finish in seconds. A job-level if:/paths skip
  # would leave the required check "expected" forever and block merges.
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect maven-mcp changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event - run all steps."
            echo "maven_mcp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pull request: three-dot diff (merge-base..head) so we see only
          # commits introduced by the PR, not unrelated changes that landed
          # on main between fork-point and head.
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'plugins/maven-mcp/**' '.github/workflows/ci.yml')
          if [ -n "$CHANGED" ]; then
            echo "maven-mcp changed:"
            echo "$CHANGED"
            echo "maven_mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "No maven-mcp changes - skipping test steps."
            echo "maven_mcp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python ${{ matrix.python-version }}
        if: steps.changes.outputs.maven_mcp == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - if: steps.changes.outputs.maven_mcp == 'true'
        run: python3 -m unittest discover -s plugins/maven-mcp/tests -v

      # Zero-dependency static gate (replaces the eslint gate the now-removed
      # node build job provided).
      - if: steps.changes.outputs.maven_mcp == 'true'
        run: python -m compileall plugins/maven-mcp/plugin/server

      # Shellcheck is preinstalled on ubuntu-latest.
      - if: steps.changes.outputs.maven_mcp == 'true'
        name: Shellcheck hooks
        run: shellcheck plugins/maven-mcp/plugin/hooks/*.sh

  # Advisory quality gates (#408) -- NOT required status checks (that is a separate
  # branch-ruleset change). Each is its own job, not extra steps on python-tests, so
  # a lint/type/coverage failure is independently visible and does not skip the
  # other two (a failed step stops the rest of ITS OWN job by default). Same
  # job-always-runs / steps-path-gated shape as python-tests above, so promoting any
  # one of these to required later needs no reshaping.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect maven-mcp changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event - run all steps."
            echo "maven_mcp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'plugins/maven-mcp/**' '.github/workflows/ci.yml')
          if [ -n "$CHANGED" ]; then
            echo "maven-mcp changed:"
            echo "$CHANGED"
            echo "maven_mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "No maven-mcp changes - skipping quality steps."
            echo "maven_mcp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.maven_mcp == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Target py39 (config `target-version`) -- oldest supported runtime, matching
      # the python-tests matrix and release.yml. Version pinned; see
      # plugins/maven-mcp/pyproject.toml for the config surveyed against this pin.
      - if: steps.changes.outputs.maven_mcp == 'true'
        run: pip install ruff==0.15.22

      - if: steps.changes.outputs.maven_mcp == 'true'
        name: Ruff lint
        run: ruff check plugins/maven-mcp/plugin/server plugins/maven-mcp/tests

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect maven-mcp changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event - run all steps."
            echo "maven_mcp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'plugins/maven-mcp/**' '.github/workflows/ci.yml')
          if [ -n "$CHANGED" ]; then
            echo "maven-mcp changed:"
            echo "$CHANGED"
            echo "maven_mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "No maven-mcp changes - skipping quality steps."
            echo "maven_mcp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.maven_mcp == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # mypy 1.20.2 is the newest release that still supports `--python-version 3.9`
      # as a CHECK TARGET -- mypy 2.0.0 raises "Python 3.9 is not supported (must be
      # 3.10 or higher)" (verified empirically by bisecting the PyPI release list).
      # The oldest-supported target (plugins/maven-mcp/CLAUDE.md: "Python 3.9+") is
      # set via `python_version` in plugins/maven-mcp/pyproject.toml, independent of
      # the interpreter running mypy itself (3.13 above).
      - if: steps.changes.outputs.maven_mcp == 'true'
        run: pip install mypy==1.20.2

      - if: steps.changes.outputs.maven_mcp == 'true'
        name: mypy type check
        run: mypy --config-file plugins/maven-mcp/pyproject.toml

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect maven-mcp changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event - run all steps."
            echo "maven_mcp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'plugins/maven-mcp/**' '.github/workflows/ci.yml')
          if [ -n "$CHANGED" ]; then
            echo "maven-mcp changed:"
            echo "$CHANGED"
            echo "maven_mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "No maven-mcp changes - skipping quality steps."
            echo "maven_mcp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.maven_mcp == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - if: steps.changes.outputs.maven_mcp == 'true'
        run: pip install coverage==7.15.2

      # Two steps (not one `&&`-chained run:) so a real test failure in `coverage
      # run` is attributed to that step, not blamed on `coverage report`; bash's
      # default `-e` for `run:` blocks already stops the step (and the job) after
      # the first failing line, so `coverage report` never executes on red tests.
      - if: steps.changes.outputs.maven_mcp == 'true'
        name: Run tests under coverage
        run: coverage run --rcfile=plugins/maven-mcp/pyproject.toml -m unittest discover -s plugins/maven-mcp/tests -v

      - if: steps.changes.outputs.maven_mcp == 'true'
        name: Coverage report (floor enforced via fail_under in pyproject.toml)
        run: coverage report --rcfile=plugins/maven-mcp/pyproject.toml

  # --- youtube-transcript ---------------------------------------------------
  # Same 4-job shape as maven-mcp above (job-always-runs / steps-path-gated),
  # mirrored exactly rather than generalized into a shared/reusable workflow --
  # this repo has exactly two plugins today and a premature abstraction would
  # cost more to keep in sync than the duplication does. Job IDs are prefixed
  # (youtube-transcript-*) since maven-mcp already owns the unprefixed
  # python-tests/ruff/mypy/coverage IDs.
  youtube-transcript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect youtube-transcript changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event - run all steps."
            echo "youtube_transcript=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pull request: three-dot diff (merge-base..head) so we see only
          # commits introduced by the PR, not unrelated changes that landed
          # on main between fork-point and head.
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'plugins/youtube-transcript/**' '.github/workflows/ci.yml')
          if [ -n "$CHANGED" ]; then
            echo "youtube-transcript changed:"
            echo "$CHANGED"
            echo "youtube_transcript=true" >> "$GITHUB_OUTPUT"
          else
            echo "No youtube-transcript changes - skipping test steps."
            echo "youtube_transcript=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python ${{ matrix.python-version }}
        if: steps.changes.outputs.youtube_transcript == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - if: steps.changes.outputs.youtube_transcript == 'true'
        run: python3 -m unittest discover -s plugins/youtube-transcript/tests -v

      # Zero-dependency static gate (same rationale as maven-mcp's compileall step).
      - if: steps.changes.outputs.youtube_transcript == 'true'
        run: python -m compileall plugins/youtube-transcript/plugin/server

  youtube-transcript-ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect youtube-transcript changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event - run all steps."
            echo "youtube_transcript=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'plugins/youtube-transcript/**' '.github/workflows/ci.yml')
          if [ -n "$CHANGED" ]; then
            echo "youtube-transcript changed:"
            echo "$CHANGED"
            echo "youtube_transcript=true" >> "$GITHUB_OUTPUT"
          else
            echo "No youtube-transcript changes - skipping quality steps."
            echo "youtube_transcript=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.youtube_transcript == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Same pin as maven-mcp's ruff job; see plugins/youtube-transcript/pyproject.toml
      # for the config (target-version = py39, matching the tests matrix).
      - if: steps.changes.outputs.youtube_transcript == 'true'
        run: pip install ruff==0.15.22

      - if: steps.changes.outputs.youtube_transcript == 'true'
        name: Ruff lint
        run: ruff check plugins/youtube-transcript/plugin/server plugins/youtube-transcript/tests

  youtube-transcript-mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect youtube-transcript changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event - run all steps."
            echo "youtube_transcript=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'plugins/youtube-transcript/**' '.github/workflows/ci.yml')
          if [ -n "$CHANGED" ]; then
            echo "youtube-transcript changed:"
            echo "$CHANGED"
            echo "youtube_transcript=true" >> "$GITHUB_OUTPUT"
          else
            echo "No youtube-transcript changes - skipping quality steps."
            echo "youtube_transcript=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.youtube_transcript == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Same version pin as maven-mcp's mypy job -- see that job's comment for
      # why 1.20.2 is the newest release that still supports `--python-version
      # 3.9` as a check target.
      - if: steps.changes.outputs.youtube_transcript == 'true'
        run: pip install mypy==1.20.2

      - if: steps.changes.outputs.youtube_transcript == 'true'
        name: mypy type check
        run: mypy --config-file plugins/youtube-transcript/pyproject.toml

  youtube-transcript-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect youtube-transcript changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event - run all steps."
            echo "youtube_transcript=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'plugins/youtube-transcript/**' '.github/workflows/ci.yml')
          if [ -n "$CHANGED" ]; then
            echo "youtube-transcript changed:"
            echo "$CHANGED"
            echo "youtube_transcript=true" >> "$GITHUB_OUTPUT"
          else
            echo "No youtube-transcript changes - skipping quality steps."
            echo "youtube_transcript=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.youtube_transcript == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - if: steps.changes.outputs.youtube_transcript == 'true'
        run: pip install coverage==7.15.2

      - if: steps.changes.outputs.youtube_transcript == 'true'
        name: Run tests under coverage
        run: coverage run --rcfile=plugins/youtube-transcript/pyproject.toml -m unittest discover -s plugins/youtube-transcript/tests -v

      - if: steps.changes.outputs.youtube_transcript == 'true'
        name: Coverage report (floor enforced via fail_under in pyproject.toml)
        run: coverage report --rcfile=plugins/youtube-transcript/pyproject.toml

  # MCPB bundle build + smoke test. Same job-always-runs / steps-path-gated
  # shape as the other youtube-transcript-* jobs, but the watched paths cover
  # the bundling toolchain (tools/mcpb/**, scripts/pack-mcpb.sh,
  # scripts/smoke-mcpb.sh, scripts/tests/test-smoke-negatives.sh) in addition
  # to the plugin itself, since a change to the packer or its lockfile should
  # gate this job even when plugins/youtube-transcript/ is untouched.
  # Uploads the built bundle as an artifact so it can be downloaded and
  # installed into the desktop app for the mandatory L5 manual check before
  # merge -- Stage 1 does not publish the bundle anywhere else.
  youtube-transcript-mcpb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push event - run all steps."
            echo "mcpb=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pull request: three-dot diff (merge-base..head) so we see only
          # commits introduced by the PR, not unrelated changes that landed
          # on main between fork-point and head.
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- \
            'plugins/youtube-transcript/**' 'scripts/pack-mcpb.sh' \
            'scripts/smoke-mcpb.sh' 'scripts/tests/test-smoke-negatives.sh' \
            'tools/mcpb/**' '.github/workflows/ci.yml' 'LICENSE.md')
          if [ -n "$CHANGED" ]; then
            echo "mcpb-relevant changes:"
            echo "$CHANGED"
            echo "mcpb=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mcpb-relevant changes - skipping build steps."
            echo "mcpb=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changes.outputs.mcpb == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/mcpb/package-lock.json

      - name: Setup Python
        if: steps.changes.outputs.mcpb == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - if: steps.changes.outputs.mcpb == 'true'
        name: Install mcpb toolchain
        working-directory: tools/mcpb
        run: npm ci --ignore-scripts

      # Audit gate for the pinned mcpb toolchain. `set -euo pipefail` and the
      # report-shape assertion below are load-bearing, not cosmetic: a `run:`
      # block is `bash -e` WITHOUT pipefail by default, so on a registry
      # outage `jq` dies with "Cannot iterate over null", the pipeline's exit
      # status is taken from `sort` (0), found.txt ends up empty, and the step
      # reports success -- verified by forcing a registry outage
      # (--registry=http://127.0.0.1:9/) and observing exactly this false
      # green. `--audit-level` is deliberately not used: it only changes the
      # exit code, not the JSON, so severity filtering happens in jq instead.
      - if: steps.changes.outputs.mcpb == 'true'
        name: Audit pinned toolchain
        working-directory: tools/mcpb          # allowlist path is relative to this
        run: |
          set -euo pipefail
          npm audit --json > audit.json || true   # exits non-zero whenever findings exist
          jq -e 'has("vulnerabilities")' audit.json > /dev/null \
            || { echo "::error::npm audit produced no usable report"; exit 1; }
          jq -r '[.vulnerabilities[].via[]? | select(type=="object")
                  | select(.severity=="high" or .severity=="critical")
                  | .url | split("/")[-1]] | unique[]' audit.json | sort -u > found.txt
          # `|| true` because an empty allowlist is legitimate (nothing accepted
          # yet): grep exits 1 on no match, and under set -e + pipefail that
          # aborts the step before the diagnostic below can name the offenders.
          grep -o 'GHSA-[a-z0-9-]*' audit-allowlist.txt | sort -u > allowed.txt || true
          UNEXPECTED=$(comm -23 found.txt allowed.txt)
          [ -z "$UNEXPECTED" ] || { echo "::error::unallowlisted advisories: $UNEXPECTED"; exit 1; }

      - if: steps.changes.outputs.mcpb == 'true'
        name: Pack MCPB bundle
        id: pack
        run: bash scripts/pack-mcpb.sh

      - if: steps.changes.outputs.mcpb == 'true'
        name: Smoke test bundle
        run: bash scripts/smoke-mcpb.sh "${{ steps.pack.outputs.mcpb_path }}"

      # Upload before the negative tests, not after: case 9 ("staged symlink")
      # re-invokes pack-mcpb.sh, whose step 4 clears dist/youtube-transcript-*
      # before the symlink guard aborts it -- so running the negatives leaves
      # dist/ empty and a later upload would fail on if-no-files-found: error.
      # Verified by running pack -> negatives locally and finding dist/ empty.
      - if: steps.changes.outputs.mcpb == 'true'
        name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: |
            ${{ steps.pack.outputs.mcpb_path }}
            ${{ steps.pack.outputs.mcpb_sha256_path }}
          retention-days: 14
          if-no-files-found: error

      - if: steps.changes.outputs.mcpb == 'true'
        name: Smoke test negative cases
        run: bash scripts/tests/test-smoke-negatives.sh

      # Ungated: cheap, zero external deps, and shouldn't be skipped just
      # because no watched path changed (same rationale as python-tests'
      # shellcheck step, which is likewise unconditional).
      - name: Shellcheck
        run: shellcheck scripts/*.sh scripts/tests/*.sh
